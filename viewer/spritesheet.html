<!doctype html>
<html lang="fr">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Lecteur spritesheet</title
  ><style>
    body {
      margin: 0;
      background: #11151b;
      color: #eef3f9;
      font: 14px system-ui;
    }
    nav {
      padding: 12px;
      display: flex;
      gap: 10px;
    }
    select,
    button,
    input {
      font: inherit;
    }
    canvas {
      display: block;
      width: 100%;
      height: 480px;
    }
    #message {
      padding: 15px;
    }
  </style>
  <nav>
    <label
      >Action
      <select id="actions"></select></label
    ><label
      >FPS
      <input
        id="fps"
        type="number"
        min="1"
        max="120"
        value="24"
        style="width: 60px" /></label
    ><button id="pause">Pause</button>
  </nav>
  <p id="message"></p>
  <canvas id="canvas" width="1000" height="600"></canvas>
  <script type="module">
    const p = JSON.parse(decodeURIComponent(location.hash.slice(1) || "{}"));
    const canvas = document.getElementById("canvas"),
      ctx = canvas.getContext("2d");
    try {
      const r = await fetch(p.sheet);
      if (!r.ok) throw new Error("Spritesheet indisponible");
      const sheet = await r.json();
      const frames = Array.isArray(sheet.frames)
        ? Object.fromEntries(
            sheet.frames.map((f, i) => [f.filename || String(i), f]),
          )
        : sheet.frames;
      const actions =
        sheet.animations && Object.keys(sheet.animations).length
          ? sheet.animations
          : { "Toutes les frames": Object.keys(frames) };
      const sel = document.getElementById("actions");
      for (const n of Object.keys(actions)) sel.add(new Option(n, n));
      const images = new Map();
      let paused = false;
      document.getElementById("pause").onclick = (e) => {
        paused = !paused;
        e.target.textContent = paused ? "Lecture" : "Pause";
      };
      for (const [n, f] of Object.entries(frames)) {
        const rect = f.frame;
        const source = new Image();
        source.src =
          p.assets + "/" + p.pieces.find((x) => x.region === n)?.file;
        try {
          await source.decode();
          images.set(n, source);
        } catch {}
      }
      let last = 0,
        index = 0;
      sel.onchange = () => {
        index = 0;
      };
      function tick(time) {
        const names = actions[sel.value] || [];
        if (
          !paused &&
          time - last >
            1000 /
              Math.max(
                1,
                Math.min(
                  120,
                  Number(document.getElementById("fps").value) || 24,
                ),
              )
        ) {
          index = (index + 1) % Math.max(1, names.length);
          last = time;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const name =
          typeof names[index] === "object" ? names[index].name : names[index];
        const image = images.get(String(name));
        if (image) {
          const f = frames[name],
            full = f.sourceSize || { w: image.width, h: image.height },
            pos = f.spriteSourceSize || { x: 0, y: 0 };
          const scale = Math.min(4, 800 / full.w, 450 / full.h);
          ctx.drawImage(
            image,
            (canvas.width - full.w * scale) / 2 + pos.x * scale,
            (canvas.height - full.h * scale) / 2 + pos.y * scale,
            image.width * scale,
            image.height * scale,
          );
        }
        document.getElementById("message").textContent = names.length
          ? `${sel.value} · ${index + 1}/${names.length} · vitesse ajustable (24 FPS par défaut)`
          : "Aucune séquence de frames exploitable";
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    } catch (e) {
      document.getElementById("message").textContent = e.message;
    }
  </script>
</html>
